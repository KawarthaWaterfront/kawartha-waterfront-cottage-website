<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/icons/website_icon/la_picholine_logo_no_text_background.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Pairs with public/404.html: GitHub Pages has no server-side
         routing, so a direct visit or refresh on a client-side route (e.g.
         /gallery) 404s there first, which stashes the intended path and
         redirects here. This restores the clean URL via
         history.replaceState *before* React Router mounts (the module
         script below is deferred by spec, so this always runs first
         regardless of load timing), so the correct route renders on the
         very first paint instead of bouncing through the home page. -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect)
        }
      })()
    </script>
    <!-- Fonts are self-hosted (public/fonts/, @font-face rules in
         src/index.css) instead of linked from fonts.googleapis.com - no
         third-party DNS/TLS/request round trip at all now, not just a
         non-blocking one. Preloading just the two weights used above the
         fold (Marcellus for headings, Lora regular for body copy) starts
         their fetch immediately instead of waiting for index.css to be
         parsed and the @font-face rules discovered; the heavier/less
         common weights (500, 600, italic) aren't preloaded since they're
         rarely needed for the very first paint. -->
    <link rel="preload" href="./fonts/marcellus-v14-latin-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/lora-v37-latin-regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>Kawartha Waterfront Cottage</title>
    <!-- Google Analytics (GA4). gtag.js is `async` (non-blocking, loaded in
         parallel) and isn't an npm dependency at all, so unlike aws-rum-web
         before it there's no JS bundle weight to defer here.
         send_page_view is turned off in the config call below - this is an
         SPA (client-side routing), so App.jsx fires its own page_view event
         on every route change (including the first one) via
         src/analytics.js instead, rather than letting gtag fire one
         automatically only for this initial real page load and then never
         again on navigation. G-0521JX6CK1 is replaced with the
         matching .env value at build time (Vite's own HTML env
         substitution) - see .env for the placeholder to fill in. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0521JX6CK1"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() { dataLayer.push(arguments) }
      gtag('js', new Date())
      gtag('config', 'G-0521JX6CK1', { send_page_view: false })
    </script>
    <script type="module" crossorigin src="./assets/index-BigS5y-B.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D-2ve12i.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
