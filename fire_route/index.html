<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/website_icon/la_picholine_logo_no_text.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted (public/fonts/, @font-face rules in
         src/index.css) instead of linked from fonts.googleapis.com - no
         third-party DNS/TLS/request round trip at all now, not just a
         non-blocking one. Preloading just the two weights used above the
         fold (Marcellus for headings, Lora regular for body copy) starts
         their fetch immediately instead of waiting for index.css to be
         parsed and the @font-face rules discovered; the heavier/less
         common weights (500, 600, italic) aren't preloaded since they're
         rarely needed for the very first paint. -->
    <link rel="preload" href="/fonts/marcellus-v14-latin-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lora-v37-latin-regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>Kawartha Waterfront Cottage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
